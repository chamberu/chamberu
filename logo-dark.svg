<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch-title">
    <title id="ch-title">chamvi logo: three arched chambers, one per agent, each holding the steps its run has checkpointed; the middle one is running</title>
    <style>
        :root {
            --accent: #E04652;
            --ink: #EDE6E3;
            --grey: #7D7375;
            --tile-a: #201D1F;
            --tile-b: #19171A;
        }
        .accent { fill: var(--accent); }
        .ink { fill: var(--ink); }
        .grey { fill: var(--grey); }
        .accent-line { stroke: var(--accent); }
        .accent-stop { stop-color: var(--accent); }
        .ink-stop { stop-color: var(--ink); }
        .tile-a { stop-color: var(--tile-a); }
        .tile-b { stop-color: var(--tile-b); }
    </style>
    <defs>
        <linearGradient id="ch-tile" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop class="accent-stop" stop-color="#C8303B" stop-opacity="0.18"/>
            <stop offset="1" class="ink-stop" stop-color="#1B1A1C" stop-opacity="0.18"/>
        </linearGradient>
        <linearGradient id="ch-edge" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop class="accent-stop" stop-color="#C8303B"/>
            <stop offset="1" class="ink-stop" stop-color="#1B1A1C"/>
        </linearGradient>
        <linearGradient id="ch-stone" x1="128" y1="58" x2="128" y2="206" gradientUnits="userSpaceOnUse">
            <stop class="accent-stop" stop-color="#C8303B"/>
            <stop offset="1" class="ink-stop" stop-color="#1B1A1C"/>
        </linearGradient>
    </defs>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#ch-tile)"/>
    <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" stroke="url(#ch-edge)" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- the running chamber is lit -->
    <path d="M103 200 V92 A25 25 0 0 1 153 92 V200 Z" class="accent" fill="#C8303B" fill-opacity="0.24"/>

    <!-- three chambers on one floor -->
    <g stroke="url(#ch-stone)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path d="M48 200 V122 A19 19 0 0 1 86 122 V200"/>
        <path d="M103 200 V92 A25 25 0 0 1 153 92 V200"/>
        <path d="M170 200 V122 A19 19 0 0 1 208 122 V200"/>
        <path d="M36 204 H220"/>
    </g>

    <!-- checkpointed steps, stacked bottom up -->
    <rect x="58" y="178" width="18" height="12" rx="6" class="ink" fill="#1B1A1C"/>
    <rect x="114" y="178" width="28" height="12" rx="6" class="ink" fill="#1B1A1C"/>
    <rect x="114" y="160" width="28" height="12" rx="6" class="grey" fill="#9A9396"/>
    <rect x="114" y="142" width="28" height="12" rx="6" class="accent" fill="#C8303B">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.6s" repeatCount="1" fill="freeze"/>
    </rect>
    <rect x="180" y="178" width="18" height="12" rx="6" class="ink" fill="#1B1A1C"/>
    <rect x="180" y="160" width="18" height="12" rx="6" class="grey" fill="#9A9396"/>
</svg>
