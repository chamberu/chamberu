<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ct-title">
    <title id="ct-title">@chamvi/test-kit logo: the chamvi chambers, the middle one holding a check mark for a passed store contract</title>
    <style>
        :root {
            --accent: #7C3AED;
            --ink: #1A1523;
            --grey: #9A93A8;
            --tile-a: #FFFFFF;
            --tile-b: #E5E0ED;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --accent: #A78BFA;
                --ink: #ECE6F5;
                --grey: #7A7189;
                --tile-a: #1C1724;
                --tile-b: #15111B;
            }
        }
        .accent { fill: var(--accent); }
        .ink { fill: var(--ink); }
        .grey { fill: var(--grey); }
        .accent-line { stroke: var(--accent); }
        .accent-stop { stop-color: var(--accent); }
        .ink-stop { stop-color: var(--ink); }
        .tile-a { stop-color: var(--tile-a); }
        .tile-b { stop-color: var(--tile-b); }
    </style>
    <defs>
        <linearGradient id="ct-tile" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop class="accent-stop" stop-color="#7C3AED" stop-opacity="0.18"/>
            <stop offset="1" class="ink-stop" stop-color="#1A1523" stop-opacity="0.18"/>
        </linearGradient>
        <linearGradient id="ct-edge" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop class="accent-stop" stop-color="#7C3AED"/>
            <stop offset="1" class="ink-stop" stop-color="#1A1523"/>
        </linearGradient>
        <linearGradient id="ct-stone" x1="128" y1="58" x2="128" y2="206" gradientUnits="userSpaceOnUse">
            <stop class="accent-stop" stop-color="#7C3AED"/>
            <stop offset="1" class="ink-stop" stop-color="#1A1523"/>
        </linearGradient>
    </defs>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#ct-tile)"/>
    <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" stroke="url(#ct-edge)" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- the running chamber is lit -->
    <path d="M103 200 V92 A25 25 0 0 1 153 92 V200 Z" class="accent" fill="#7C3AED" fill-opacity="0.24"/>

    <!-- three chambers on one floor -->
    <g stroke="url(#ct-stone)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path d="M48 200 V122 A19 19 0 0 1 86 122 V200"/>
        <path d="M103 200 V92 A25 25 0 0 1 153 92 V200"/>
        <path d="M170 200 V122 A19 19 0 0 1 208 122 V200"/>
        <path d="M36 204 H220"/>
    </g>

    <!-- checkpointed steps, stacked bottom up -->
    <rect x="58" y="178" width="18" height="12" rx="6" class="ink" fill="#1A1523"/>
    <path d="M114 166 L124 177 L144 148" class="accent-line" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="1;1;0" keyTimes="0;0.4;1" dur="1.6s" repeatCount="1" fill="freeze"/>
    </path>
    <rect x="180" y="178" width="18" height="12" rx="6" class="ink" fill="#1A1523"/>
    <rect x="180" y="160" width="18" height="12" rx="6" class="grey" fill="#9A93A8"/>
</svg>
