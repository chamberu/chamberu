name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Node ${{ matrix.node-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Install
              uses: ./.github/actions/install
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
            - name: Typecheck
              run: npm run typecheck
            - name: Test
              run: npm run test
