name: Deploy Docs

on:
    push:
        branches:
            - master
        paths:
            - 'packages/**'
            - '.github/workflows/docs.yml'
    pull_request:
        branches:
            - master
        paths:
            - 'packages/**'
            - '.github/workflows/docs.yml'

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

env:
    PRIMARY_NODE_VERSION: 24

jobs:
    docs:
        name: Build & deploy docs
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Install
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.PRIMARY_NODE_VERSION }}

            # the snippets the pages include must compile against the current sources
            -   name: Typecheck snippets
                run: npm run typecheck -w @chamberu/docs

            -   name: Build docs
                run: npm run docs:build

            # Custom domain: TBD. Once it is chosen, write it to
            # ./packages/docs/src/.vitepress/dist/CNAME before the deploy step.

            -   name: Deploy
                if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
                uses: peaceiris/actions-gh-pages@v4
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: ./packages/docs/src/.vitepress/dist
