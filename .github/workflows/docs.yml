name: Deploy Docs

on:
    push:
        branches:
            - master
        paths:
            - 'packages/**'
            - '.github/workflows/docs.yml'
    pull_request:
        branches:
            - master
        paths:
            - 'packages/**'
            - '.github/workflows/docs.yml'

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

env:
    PRIMARY_NODE_VERSION: 24

jobs:
    build:
        name: Build docs
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Install
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.PRIMARY_NODE_VERSION }}

            # the snippets the pages include must compile against the current sources
            -   name: Typecheck snippets
                run: npm run typecheck -w @chamberu/docs

            -   name: Build docs
                run: npm run docs:build

            -   name: Upload artifact
                if: ${{ github.event_name == 'push' }}
                uses: actions/upload-artifact@v7
                with:
                    name: docs-dist
                    path: ./packages/docs/src/.vitepress/dist

    deploy:
        name: Deploy to chamberu.dev
        if: ${{ github.event_name == 'push' }}
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    sparse-checkout: packages/docs/CNAME
                    sparse-checkout-cone-mode: false

            -   name: Download artifact
                uses: actions/download-artifact@v8
                with:
                    name: docs-dist
                    path: ./dist

            # GitHub Pages reads the custom domain from a CNAME file in the published root
            -   name: CNAME
                run: cp ./packages/docs/CNAME ./dist/CNAME

            -   name: Deploy
                uses: peaceiris/actions-gh-pages@v4
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: ./dist
